[project]
name = "aegistondoc"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "services/shared-py",
    "services/collab-server",
    "services/kb-server",
    "services/kb-workers",
]

[tool.uv.sources]
collab-server = { workspace = true }
kb-server = { workspace = true }
kb-workers = { workspace = true }
shared-py = { workspace = true }

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]

[tool.pyright]
include = ["services"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["services"]

[dependency-groups]
dev = [
    "collab-server",
    "httpx",
    "kb-server",
    "kb-workers",
    "pyright>=1.1.414",
    "pytest",
    "pytest-asyncio",
    "ruff>=0.17.6",
    "shared-py",
]
